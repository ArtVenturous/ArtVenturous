<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ARTO | Portfolio</title>
    <link rel="icon" href="portfolio/assets/icon.svg">
    
    <!-- Pre-loading modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&family=Dancing+Script:wght@500&family=Rubik+Doodle+Shadow&family=Geo:ital@1&display=swap" rel="stylesheet">
    
    <!-- Global Stylesheet -->
    <link rel="stylesheet" href="portfolio/css/style.css">

    <!-- Component Styles -->
    <link rel="stylesheet" href="portfolio/css/components.css">
  </head>
<body>
    <!-- 1. Accessibility Skip Link -->
    <a href="#app-root" class="skip-link">Skip to content</a>

    <!-- 2. No-JS Fallback -->
    <noscript>
        <div style="text-align: center; padding: 4rem 2rem; font-family: sans-serif;">
            <h2>JavaScript Required</h2>
            <p>This portfolio is an interactive web application. Please enable JavaScript to view.</p>
        </div>
    </noscript>

    <!-- Global Loading Screen -->
    <div id="global-loader" class="loader-overlay">
        <div class="loader-content">
            <div class="loader-text" id="loader-text">SYSTEM INIT...</div>
        </div>
    </div>

     <!-- The App Shell -->
    <div id="app-shell">
        
        <!-- Top Bar -->
        <header class="app-topbar">
            <div class="brand">A R T O</div>
        </header>

        <!-- Top Scroll Progress Bar -->
        <div class="scroll-progress-container">
            <div id="scroll-progress-bar" class="scroll-progress-bar"></div>
        </div>

        <!-- Dynamic Viewport -->
        <main class="app-viewport">
            
            <!-- Global Sub Nav Bar-->
            <nav id="global-subnav" class="page-subnav" style="display: none;">
                <div class="subnav-content" id="global-subnav-content"></div>
            </nav>

            <div id="app-root" class="view-container">
                <!-- JavaScript will mount Pages here -->
            </div>

            <!-- Global Persistent Footer -->
            <footer class="site-footer">
                <div class="footer-content">
                    <!-- Back to Top -->
                    <button type="button" id="back-to-top" class="back-to-top-btn" title="Back to Top">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="18 15 12 9 6 15"></polyline>
                        </svg>
                        <span>Back to Top</span>
                    </button>
                    <!-- Footer Social / Contact Icons -->
                    <div class="footer-socials">
                        <a href="https://www.facebook.com/artorandain/" target="_blank" rel="noopener noreferrer" title="Facebook" class="footer-social-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                            </svg>
                        </a>
                        <a href="mailto:april.orandain@gmail.com" title="Email" class="footer-social-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </a>
                        <a href="tel:+639085007951" title="Phone" class="footer-social-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                        </a>
                        <a href="https://github.com/Artventurous" target="_blank" rel="noopener noreferrer" title="GitHub" class="footer-social-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                            </svg>
                        </a>
                    </div>
                    <!-- Footer Text -->
                    <p>&copy; 2026 ARTO. All Rights Reserved.</p>
                </div>
            </footer>
        </main>

        <!-- Persistent Bottom Tab Bar (Native App Navigation) -->
        <nav class="bottom-tab-bar" id="main-nav">
            <!-- Desktop Sidebar Header (Toggle + Logo) -->
            <div class="sidebar-header">
                <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Toggle Sidebar">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="sidebar-logo brand">ARTO</div>
            </div>

            <a href="#home" class="tab-item active" aria-label="Home">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="tab-label">Home</span>
            </a>
            
            <a href="#projects" class="tab-item" aria-label="Projects">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span class="tab-label">Projects</span>
            </a>
            
            <a href="#about" class="tab-item" aria-label="About">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span class="tab-label">About</span>
            </a>

        </nav>

    </div>

    <!-- Component Scripts -->
    <script src="portfolio/js/component/home.js" defer></script>
    <script src="portfolio/js/component/projects.js" defer></script>
    <script src="portfolio/js/component/about.js" defer></script>
    <script src="portfolio/js/component/contact.js" defer></script>

    <!-- Core Engine -->
    <script src="portfolio/js/core/site.js" defer></script>

</body>
</html>
